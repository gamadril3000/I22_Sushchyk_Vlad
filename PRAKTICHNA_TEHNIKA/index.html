   <header>

   <main>
        <h3>Популярні товари</h3>

                    <h3>ПОТУЖНИЙ Флагманський телефон</h3>
                    <img src="tel.jpg" alt="tel" height="120px">
                    <figcaption>Дуже живучий Флагман Nokia</figcaption>

            <article class="card">

            <article class="card">
                <figure class="nayshi">
                    <h3>Бездротові навушники + шалом</h3>
                    <img src="nayshi.jpg" alt="nayshi" height="120px">
                    <figcaption>Одні з найкращих навушників для шутерів<br>Шолом в подарунок!</figcaption>
                    <p>Ціна: <strong>6 149 грн.</strong></p>
